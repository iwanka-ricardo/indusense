[project]
name = "indusense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ricardo", email = "ricardo.mercado@iwanka.fr" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "pandas>=3.1.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2.1.9",
    "sqlglot>=30.35.0",
]

[project.scripts]
indusense = "indusense:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
