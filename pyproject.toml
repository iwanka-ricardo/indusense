[project]
name = "indusense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ricardo", email = "ricardo.mercado@iwanka.fr" }
]
requires-python = ">=3.15"
dependencies = [
    "pandas>=3.1.1",
    "sqlglot>=30.35.0",
]

[project.scripts]
indusense = "indusense:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
