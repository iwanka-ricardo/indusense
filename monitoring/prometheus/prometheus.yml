# Prometheus : collecte des métriques techniques (pas de qualité métier des données).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API Indusense lancée sur l'hôte avec `make api` (port API_PORT, 8000 par défaut)
  - job_name: indusense-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
